name: Build Aseprite for Mac M1

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/aseprite_build_deploy.yml"

permissions:
  contents: read

jobs:
  build-aseprite:
    name: Build Aseprite (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Install build tools
        run: |
          brew install ninja cmake

      - name: Find latest Aseprite release
        id: version
        shell: bash
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/aseprite/aseprite/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Aseprite $TAG"

      - name: Download Aseprite source
        shell: bash
        run: |
          git clone --recursive --branch "${{ steps.version.outputs.tag }}" --depth 1 https://github.com/aseprite/aseprite.git
          cd aseprite
          git submodule update --init --recursive

      - name: Build native Apple Silicon version
        shell: bash
        run: |
          cd aseprite
          chmod +x build.sh
          ./build.sh --auto --norun

      - name: Show built files
        shell: bash
        run: |
          file aseprite/build/bin/aseprite
          ls -lah aseprite/build/bin

      - name: Upload Aseprite
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-${{ steps.version.outputs.tag }}-Mac-Apple-Silicon
          path: aseprite/build/bin/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
