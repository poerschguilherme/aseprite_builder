name: Build Aseprite for Mac M1

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/aseprite_build_deploy.yml"

permissions:
  contents: read

jobs:
  build-aseprite:
    name: Build Aseprite (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Install build tools
        shell: bash
        run: |
          brew install ninja cmake || true

      - name: Find latest Aseprite release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/aseprite/aseprite/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Aseprite $TAG"

      - name: Download Aseprite source
        shell: bash
        run: |
          git clone --recursive --branch "${{ steps.version.outputs.tag }}" --depth 1 https://github.com/aseprite/aseprite.git
          cd aseprite
          git submodule update --init --recursive

      - name: Download matching Skia
        shell: bash
        run: |
          cd aseprite
          SKIA_URL=$(bash laf/misc/skia-url.sh Release | xargs)
          SKIA_FILE=$(basename "$SKIA_URL")
          echo "Using $SKIA_URL"
          curl --ssl-revoke-best-effort -L -o "$SKIA_FILE" "$SKIA_URL"
          mkdir -p skia
          unzip -q "$SKIA_FILE" -d skia

      - name: Configure native M1 build
        shell: bash
        run: |
          cmake -S aseprite -B aseprite/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DENABLE_SCRIPTING=ON \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$GITHUB_WORKSPACE/aseprite/skia" \
            -DSKIA_LIBRARY_DIR="$GITHUB_WORKSPACE/aseprite/skia/out/Release-arm64"

      - name: Compile Aseprite
        shell: bash
        run: |
          cmake --build aseprite/build --target aseprite --parallel 3

      - name: Verify build
        shell: bash
        run: |
          file aseprite/build/bin/aseprite
          ls -lah aseprite/build/bin

      - name: Upload Aseprite
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-${{ steps.version.outputs.tag }}-Mac-M1
          path: aseprite/build/bin/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
